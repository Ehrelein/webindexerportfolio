apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-producer
  namespace: crawler
  labels:
    app: crawler-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler-producer
  template:
    metadata:
      labels:
        app: crawler-producer
    spec:
      containers:
        - name: producer
          image: go-search-indexer:latest
          command: ["node", "dist/cmd/producer/bootstrap.js"]
          envFrom:
            - configMapRef:
                name: crawler-config
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-producer
  namespace: crawler
spec:
  selector:
    app: crawler-producer
  ports:
    - port: 8080
      targetPort: 8080
  type: LoadBalancer

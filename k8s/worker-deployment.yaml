apiVersion: apps/v1
kind: Deployment
metadata:
  name: webindexer-worker
  namespace: crawler
  labels:
    app: webindexer-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webindexer-worker
  template:
    metadata:
      labels:
        app: webindexer-worker
    spec:
      containers:
        - name: worker
          image: webindexer:latest
          command: ["node", "crawler.js"]
          envFrom:
            - configMapRef:
                name: webindexer-config
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webindexer-secrets
                  key: pg-password
                  optional: true
          resources:
            requests:
              memory: "192Mi"
              cpu: "200m"
            limits:
              memory: "384Mi"
              cpu: "800m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webindexer-worker-hpa
  namespace: crawler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webindexer-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

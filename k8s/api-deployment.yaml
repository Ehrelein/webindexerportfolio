apiVersion: apps/v1
kind: Deployment
metadata:
  name: webindexer-api
  namespace: crawler
  labels:
    app: webindexer-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webindexer-api
  template:
    metadata:
      labels:
        app: webindexer-api
    spec:
      containers:
        - name: api
          image: webindexer:latest
          command: ["node", "server.js"]
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: webindexer-config
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webindexer-secrets
                  key: pg-password
                  optional: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webindexer-api
  namespace: crawler
  labels:
    app: webindexer-api
spec:
  selector:
    app: webindexer-api
  ports:
    - port: 80
      targetPort: 3000
      name: http
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webindexer-api-hpa
  namespace: crawler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webindexer-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
